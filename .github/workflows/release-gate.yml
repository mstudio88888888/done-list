name: Release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-auth-account-isolation:
    name: Real Clerk account isolation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database schema and RLS policies
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          pnpm --filter @workspace/db run push --accept-data-loss
          pnpm --filter @workspace/db run apply-account-rls

      # Detect whether Clerk credentials are present without exposing the value.
      - name: Detect Clerk credentials
        id: creds
        env:
          CLERK_SK: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          if [ -n "$CLERK_SK" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # The script creates short-lived test sessions from this admin secret.
      # Fork and untrusted pull requests do not receive this secret, so keep
      # the real test skipped there; never substitute placeholder tokens.
      - name: Run real Clerk account-isolation gate
        if: steps.creds.outputs.present == 'true'
        working-directory: artifacts/api-server
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm run test:real-auth

      # A required check that silently skips on main would allow a production
      # release without an explicit security result. Pull requests remain safe
      # without secrets, while production pushes and manual releases fail
      # closed until the repository secret is configured.
      - name: Block production release without Clerk credentials
        if: github.event_name != 'pull_request' && steps.creds.outputs.present == 'false'
        run: |
          echo "::error::CLERK_SECRET_KEY is required for production release security validation."
          exit 1

      - name: Allow untrusted pull request without Clerk credentials
        if: github.event_name == 'pull_request' && steps.creds.outputs.present == 'false'
        run: echo "Skipping real Clerk account-isolation test because pull-request secrets are unavailable."
