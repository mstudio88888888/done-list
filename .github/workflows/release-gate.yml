name: Release gate

# Runs ONLY on push to main and manual dispatch. Secrets are NEVER
# passed to pull_request events because GitHub withholds secrets only
# for fork PRs, not for same-repository branches. The pr-check.yml
# workflow provides the same-named status check for PR merge enforcement
# without exposing credentials to contributor-controlled code.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-auth-account-isolation:
    name: Real Clerk account isolation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database schema and RLS policies
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          pnpm --filter @workspace/db run push
          pnpm --filter @workspace/db run apply-account-rls

      # Detect whether Clerk credentials are present without exposing the value.
      - name: Detect Clerk credentials
        id: creds
        env:
          CLERK_SK: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          if [ -n "$CLERK_SK" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # The script creates short-lived test sessions from this admin secret.
      # Secrets are only available here on push to main and workflow_dispatch,
      # never on pull_request events — see the on: block above.
      - name: Run real Clerk account-isolation gate
        if: steps.creds.outputs.present == 'true'
        working-directory: artifacts/api-server
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm run test:real-auth

      # A required check that silently skips on main would allow a production
      # release without an explicit security result. Fail closed when the
      # secret is absent (repository not fully configured for production).
      - name: Block production release without Clerk credentials
        if: steps.creds.outputs.present == 'false'
        run: |
          echo "::error::CLERK_SECRET_KEY is required for production release security validation."
          exit 1
