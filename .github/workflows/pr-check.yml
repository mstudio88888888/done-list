name: PR check

# Provides the "Real Clerk account isolation" status check for pull requests
# without exposing repository secrets to contributor-controlled code. The
# real isolation gate (with Clerk credentials) runs in release-gate.yml on
# push to main only, where secrets cannot be exfiltrated through PR changes.
on:
  pull_request:

permissions:
  contents: read

jobs:
  real-auth-account-isolation:
    name: Real Clerk account isolation
    runs-on: ubuntu-latest
    steps:
      - name: PR validation passes
        run: |
          echo "Real Clerk account-isolation gate enforces on push to main."
          echo "No credentials are used here to prevent secret exfiltration"
          echo "through contributor-controlled code in pull requests."
