openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Account-aware notebook API
servers:
  - url: /api
tags:
  - name: health
  - name: tasks
  - name: notebook
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks belonging to the signed-in account
      parameters:
        - in: query
          name: filter
          schema: { type: string, enum: [all, pending, completed], default: all }
        - in: query
          name: type
          schema: { type: string, enum: [done, todo] }
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Task" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createTask
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tasks/stats:
    get:
      operationId: getTaskStats
      tags: [tasks]
      responses:
        "200":
          description: Task statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStats" }

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      parameters: [ { $ref: "#/components/parameters/TaskId" } ]
      responses:
        "200":
          description: Task found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateTask
      tags: [tasks]
      parameters: [ { $ref: "#/components/parameters/TaskId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTask
      tags: [tasks]
      parameters: [ { $ref: "#/components/parameters/TaskId" } ]
      responses:
        "204": { description: Task deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /notebook-items:
    get:
      operationId: listNotebookItems
      tags: [notebook]
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: domain
          required: true
          schema: { $ref: "#/components/schemas/NotebookDomain" }
        - in: query
          name: section
          schema: { type: string }
      responses:
        "200":
          description: Private notebook item list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/NotebookItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createNotebookItem
      tags: [notebook]
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotebookItemInput" }
      responses:
        "201":
          description: Private notebook item created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notebook-items/{id}:
    patch:
      operationId: updateNotebookItem
      tags: [notebook]
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/NotebookItemId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotebookItemUpdate" }
      responses:
        "200":
          description: Private notebook item updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteNotebookItem
      tags: [notebook]
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/NotebookItemId" } ]
      responses:
        "204": { description: Private notebook item deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    TaskId:
      in: path
      name: id
      required: true
      schema: { type: number }
    NotebookItemId:
      in: path
      name: id
      required: true
      schema: { type: number }
  responses:
    Unauthorized:
      description: Sign in is required
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Record not found
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties: { status: { type: string } }
    Task:
      type: object
      required: [id, title, completed, createdAt, type, position]
      properties:
        id: { type: number }
        title: { type: string }
        description: { type: [string, "null"] }
        completed: { type: boolean }
        completedAt: { type: [string, "null"], format: date-time }
        color: { type: [string, "null"], enum: [pink, grey, red, null] }
        type: { type: string, enum: [done, todo], default: done }
        position: { type: number, default: 0 }
        createdAt: { type: string, format: date-time }
    TaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, "null"] }
        completed: { type: boolean, default: false }
        completedAt: { type: [string, "null"], format: date-time }
        color: { type: [string, "null"], enum: [pink, grey, red, null] }
        type: { type: string, enum: [done, todo], default: done }
        position: { type: number, default: 0 }
    TaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, "null"] }
        completed: { type: boolean }
        completedAt: { type: [string, "null"], format: date-time }
        color: { type: [string, "null"], enum: [pink, grey, red, null] }
        type: { type: string, enum: [done, todo] }
        position: { type: number }
    TaskStats:
      type: object
      required: [total, completed, pending]
      properties:
        total: { type: number }
        completed: { type: number }
        pending: { type: number }
    NotebookDomain:
      type: string
      enum: [diary, routine, goals]
    NotebookItem:
      type: object
      required: [id, domain, position, metadata, createdAt, updatedAt]
      properties:
        id: { type: number }
        domain: { $ref: "#/components/schemas/NotebookDomain" }
        section: { type: [string, "null"] }
        title: { type: [string, "null"] }
        body: { type: [string, "null"] }
        entryDate: { type: [string, "null"], format: date }
        color: { type: [string, "null"], enum: [pink, grey, red, null] }
        position: { type: number, default: 0 }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NotebookItemInput:
      type: object
      required: [domain]
      properties:
        domain: { $ref: "#/components/schemas/NotebookDomain" }
        section: { type: [string, "null"] }
        title: { type: [string, "null"] }
        body: { type: [string, "null"] }
        entryDate: { type: [string, "null"], format: date }
        color: { type: [string, "null"], enum: [pink, grey, red, null] }
        position: { type: number, default: 0 }
        metadata: { type: object, additionalProperties: true, default: {} }
    NotebookItemUpdate:
      type: object
      properties:
        section: { type: [string, "null"] }
        title: { type: [string, "null"] }
        body: { type: [string, "null"] }
        entryDate: { type: [string, "null"], format: date }
        color: { type: [string, "null"], enum: [pink, grey, red, null] }
        position: { type: number }
        metadata: { type: object, additionalProperties: true }
    ErrorResponse:
      type: object
      required: [error]
      properties: { error: { type: string } }